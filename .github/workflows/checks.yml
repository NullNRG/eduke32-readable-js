name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
      - run: python -m compileall -q tools
      - run: python tests/source_factory/verify_sourcefirst_public_package.py
      - name: Check local launcher actions and exact-build launch gates
        run: |
          python tests/source_factory/verify_sourcefirst_project_launcher.py
          python tests/source_factory/verify_sourcefirst_launcher_gate.py
      - name: Install bounded-memory AST reader
        run: python -m pip install ijson==3.6.0
      - name: Compare shared packed-record and union lowering against native C++
        run: |
          clang++ --version
          python tests/source_factory/verify_sourcefirst_typedef_packed_assignment.py
          python tests/source_factory/verify_sourcefirst_union_selection.py
      - name: Verify filtered template identity and private storage upgrades
        run: |
          python tests/source_factory/verify_sourcefirst_own_template_identity.py
          python tests/source_factory/verify_sourcefirst_header_template_selection.py
          python tests/source_factory/verify_sourcefirst_template_reference_closure.py
          python tests/source_factory/verify_sourcefirst_predefined.py
          python tests/source_factory/verify_sourcefirst_private_fragments.py
          python tests/source_factory/verify_sourcefirst_tu_callables.py
          python tests/source_factory/verify_sourcefirst_non_odr_header_constants.py
          python tests/source_factory/verify_sourcefirst_private_nested_records.py
      - name: Verify boot container storage and original source namespaces
        run: |
          python tests/source_factory/verify_sourcefirst_template_zero_pointer_ctor.py
          python tests/source_factory/verify_sourcefirst_header_array_fragment.py
          python tests/source_factory/verify_sourcefirst_range_values.py
          python tests/source_factory/verify_sourcefirst_tag_value_namespace.py
          python tests/source_factory/verify_sourcefirst_byte_tail_array.py
          python tests/source_factory/verify_sourcefirst_directory_bridge.py
          python tests/source_factory/verify_sourcefirst_owner_header_aliases.py
          python tests/source_factory/verify_sourcefirst_record_pointer_types.py
          python tests/source_factory/verify_sourcefirst_layout_dump_retry.py
          python tests/source_factory/verify_sourcefirst_record_field_storage.py
          python tests/source_factory/verify_sourcefirst_cast_field_view.py
          python tests/source_factory/verify_sourcefirst_source_template_values.py
          python tests/source_factory/verify_sourcefirst_implicit_union_members.py
          python tests/source_factory/verify_sourcefirst_anonymous_geometry.py
          python tests/source_factory/verify_sourcefirst_header_method_superset.py
          python tests/source_factory/verify_sourcefirst_header_pointer_operators.py
          python tests/source_factory/verify_sourcefirst_authored_copy_move.py
          python tests/source_factory/verify_sourcefirst_native_class_address_cast.py
          python tests/source_factory/verify_sourcefirst_trivial_local_union.py
          python tests/source_factory/verify_sourcefirst_anonymous_type_spelling.py
          python tests/source_factory/verify_sourcefirst_terminal_pointer_steps.py
          python tests/source_factory/verify_sourcefirst_terminal_scanline_steps.py
          python tests/source_factory/verify_sourcefirst_deferred_pointer_limits.py
          python tests/source_factory/verify_sourcefirst_pointer_comparison_values.py
          python tests/source_factory/verify_sourcefirst_terminal_continue.py
          python tests/source_factory/verify_sourcefirst_switch_break_suffix.py
          python tests/source_factory/verify_sourcefirst_switch_integer_domains.py
          python tests/source_factory/verify_sourcefirst_scalar_retention_attrs.py
          python tests/source_factory/verify_sourcefirst_scalar_sse_round.py
          python tests/source_factory/verify_sourcefirst_scoped_assignment_types.py
            python tests/source_factory/verify_sourcefirst_local_lambdas.py
            python tests/source_factory/verify_sourcefirst_sibling_tail.py
            python tests/source_factory/verify_sourcefirst_static_pod_constructor.py
            python tests/source_factory/verify_sourcefirst_parameter_packs.py
            python tests/source_factory/verify_sourcefirst_reference_members.py
            python tests/source_factory/verify_sourcefirst_if_declarations.py
            python tests/source_factory/verify_sourcefirst_backward_tails.py
            python tests/source_factory/verify_sourcefirst_external_overloads.py
            python tests/source_factory/verify_sourcefirst_unordered_maps.py
            python tests/source_factory/verify_sourcefirst_private_unordered.py
            python tests/source_factory/verify_sourcefirst_preserved_storage_refresh.py
          python tests/source_factory/verify_sourcefirst_primary_macro_delta.py
          python tests/source_factory/verify_sourcefirst_browser_profile.py
          python tests/source_factory/verify_sourcefirst_scalar_lvalue_io.py
          python tests/source_factory/verify_sourcefirst_scalar_goto_storage.py
          python tests/source_factory/verify_sourcefirst_bsearch_records.py
          python tests/source_factory/verify_sourcefirst_trivial_record_proof.py
          python tests/source_factory/verify_sourcefirst_record_array_data_storage.py
          python tests/source_factory/verify_sourcefirst_instance_members.py
          python tests/source_factory/verify_sourcefirst_macro_packed_storage.py
          python tests/source_factory/verify_sourcefirst_pointer_union_storage.py
          python tests/source_factory/verify_sourcefirst_union_copy.py
          python tests/source_factory/verify_sourcefirst_named_pod_storage.py
          python tests/source_factory/verify_sourcefirst_pointer_alias.py
          python tests/source_factory/verify_sourcefirst_nttp_assume_aligned.py
          python tests/source_factory/verify_sourcefirst_cyclic_scalar_helpers.py
          python tests/source_factory/verify_sourcefirst_implementation_includes.py
          python tests/source_factory/verify_sourcefirst_sdl_controller_database.py
          python tests/source_factory/verify_sourcefirst_float_pointer_bridge.py
          python tests/source_factory/verify_sourcefirst_literal_array_references.py
      - run: node --test tests/source_factory/runtime.test.mjs tests/source_factory/portability.test.mjs
      - run: node --test tests/source_factory/unordered_map_service.test.mjs
      - name: Reject accidentally tracked game archives or generated pages
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^input-data/|^dist/|\.grp$)'; then
            echo 'Private assets or generated pages must not be committed.' >&2
            exit 1
          fi

      - name: Verify browser SDL storage, window lifetime and host I/O
        run: node --test tests/source_factory/stage12_sdl_display.test.mjs tests/source_factory/source_file_io.test.mjs
