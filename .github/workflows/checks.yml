name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
      - run: python -m compileall -q tools
      - run: python tests/source_factory/verify_sourcefirst_public_package.py
      - name: Check local launcher actions and exact-build launch gates
        run: |
          python tests/source_factory/verify_sourcefirst_project_launcher.py
          python tests/source_factory/verify_sourcefirst_launcher_gate.py
      - name: Install bounded-memory AST reader
        run: python -m pip install ijson==3.6.0
      - name: Compare shared packed-record and union lowering against native C++
        run: |
          clang++ --version
          python tests/source_factory/verify_sourcefirst_typedef_packed_assignment.py
          python tests/source_factory/verify_sourcefirst_union_selection.py
      - name: Verify boot container storage and original source namespaces
        run: |
          python tests/source_factory/verify_sourcefirst_template_zero_pointer_ctor.py
          python tests/source_factory/verify_sourcefirst_header_array_fragment.py
          python tests/source_factory/verify_sourcefirst_range_values.py
          python tests/source_factory/verify_sourcefirst_tag_value_namespace.py
          python tests/source_factory/verify_sourcefirst_byte_tail_array.py
          python tests/source_factory/verify_sourcefirst_directory_bridge.py
          python tests/source_factory/verify_sourcefirst_owner_header_aliases.py
          python tests/source_factory/verify_sourcefirst_record_pointer_types.py
          python tests/source_factory/verify_sourcefirst_layout_dump_retry.py
          python tests/source_factory/verify_sourcefirst_record_field_storage.py
          python tests/source_factory/verify_sourcefirst_source_template_values.py
          python tests/source_factory/verify_sourcefirst_implicit_union_members.py
          python tests/source_factory/verify_sourcefirst_header_method_superset.py
          python tests/source_factory/verify_sourcefirst_trivial_local_union.py
          python tests/source_factory/verify_sourcefirst_anonymous_type_spelling.py
          python tests/source_factory/verify_sourcefirst_terminal_pointer_steps.py
          python tests/source_factory/verify_sourcefirst_scalar_lvalue_io.py
          python tests/source_factory/verify_sourcefirst_scalar_goto_storage.py
          python tests/source_factory/verify_sourcefirst_bsearch_records.py
          python tests/source_factory/verify_sourcefirst_trivial_record_proof.py
          python tests/source_factory/verify_sourcefirst_named_pod_storage.py
          python tests/source_factory/verify_sourcefirst_pointer_alias.py
          python tests/source_factory/verify_sourcefirst_nttp_assume_aligned.py
          python tests/source_factory/verify_sourcefirst_cyclic_scalar_helpers.py
          python tests/source_factory/verify_sourcefirst_implementation_includes.py
          python tests/source_factory/verify_sourcefirst_sdl_controller_database.py
          python tests/source_factory/verify_sourcefirst_float_pointer_bridge.py
          python tests/source_factory/verify_sourcefirst_literal_array_references.py
      - run: node --test tests/source_factory/runtime.test.mjs tests/source_factory/portability.test.mjs
      - name: Reject accidentally tracked game archives or generated pages
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^input-data/|^dist/|\.grp$)'; then
            echo 'Private assets or generated pages must not be committed.' >&2
            exit 1
          fi

      - name: Verify browser SDL storage, window lifetime and host I/O
        run: node --test tests/source_factory/stage12_sdl_display.test.mjs tests/source_factory/source_file_io.test.mjs
